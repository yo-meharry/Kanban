<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <h1>Kanban</h1>
      </div>
      <div class="nav-add-button">
        <button class="addBtn" id="addBtn">Add new Task</button>
      </div>
    </nav>
  </header>
  <main>
    <div class="task-box">
      <div class="box" id="todoBox">

        <div class="title-box">
          <p class="todo-title" id="todoTitle">To Do</p>
          <p class="todo-count" id="todoCount">1</p>
        </div>
        <div class="task-list" id="todoList">
        </div>
      </div>
      <div class="box" id="progressBox">
        <div class="title-box">
          <p class="progress-title" id="progressTitle">In Progress</p>
          <p class="progress-count" id="progressCount">1</p>
        </div>
        <div class="task-list" id="progressList">
        </div>
      </div>
      <div class="box" id="doneBox">
        <div class="title-box">
          <p class="done-title" id="doneTitle">Done</p>
          <p class="done-count" id="doneCount">1</p>
        </div>
      </div>
    </div>
  </main>
</body>
<script src="script.js"></script>

</html>
